
name: Extract ZIP to Main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract ZIP
        run: |
          mkdir -p temp_extract
          unzip -o LVNG-ZORCH-source.zip -d temp_extract

      - name: Locate Android Project
        run: |
          PROJECT=$(find temp_extract -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Gradle project tidak ditemukan!"
            exit 1
          fi

          echo "SOURCE_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Copy Project to Root
        run: |
          rsync -av \
            --exclude='.github/' \
            "$SOURCE_DIR"/ ./

          rm -rf temp_extract

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Install LVNG ZORCH source"
            git push origin main
          fi
          
