
name: Extract ZIP Only

on:
  workflow_dispatch:
  push:
    paths:
      - "LVNG-ZORCH-source.zip"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o LVNG-ZORCH-source.zip -d extracted

      - name: Upload Extracted Files
        uses: actions/upload-artifact@v4
        with:
          name: LVNG-ZORCH-EXTRACTED
          path: extracted/
          if-no-files-found: error
          retention-days: 30
          
